3cbr\u003eI heard the panting of the engine, the rumble of the wheels ×1","\u003cb\u003eSubstitute senses (1)\u003c\u002fb\u003e\u003cbr\u003eSegment 11: A new passenger and the guessing game\u003cbr\u003e1 hit(s)\u003cbr\u003eI wanted to raise my hand and touch her hair but she moved away ×1"],"x":[1,11,6,1,2,6,11],"y":["Literal sight (1)","Literal sight (1)","Imagined sight (1)","Substitute senses (1)","Substitute senses (1)","Substitute senses (1)","Substitute senses (1)"],"type":"scatter"},{"hovertemplate":"%{text}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#8c2f39","line":{"color":"white","width":1},"opacity":0.8,"size":[1,1,1],"sizemin":5,"sizemode":"area","sizeref":0.006172839506172839},"mode":"markers","name":"2. Performance and concealment","text":["\u003cb\u003ePretence (2)\u003c\u002fb\u003e\u003cbr\u003eSegment 2: First words: who saw whom\u003cbr\u003e1 hit(s)\u003cbr\u003eI didn’t see you either ×1","\u003cb\u003eConcealment (2)\u003c\u002fb\u003e\u003cbr\u003eSegment 3: The resolve to hide, and the aunt at Saharanpur\u003cbr\u003e1 hit(s)\u003cbr\u003eI wondered if I would be able to prevent her from discovering that I was blind ×1","\u003cb\u003eConcealment (2)\u003c\u002fb\u003e\u003cbr\u003eSegment 7: Silence, then &quot;an interesting face&quot;\u003cbr\u003e1 hit(s)\u003cbr\u003eI knew that there were hardly any animals left in the forests near Dehra ×1"],"x":[2,3,7],"y":["Pretence (2)","Concealment (2)","Concealment (2)"],"type":"scatter"},{"hovertemplate":"%{text}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#4a7c59","line":{"color":"white","width":1},"opacity":0.8,"size":[1,1,1,1,2,1,1],"sizemin":5,"sizemode":"area","sizeref":0.006172839506172839},"mode":"markers","name":"3. Evasion and assumption","text":["\u003cb\u003eEvasion (3)\u003c\u002fb\u003e\u003cbr\u003eSegment 8: Gallant and serious, and the journey&#x27;s end\u003cbr\u003e1 hit(s)\u003cbr\u003eI thought, then, that I would try to laugh for her, but the thought of laughter only made me feel troubled and lonely ×1","\u003cb\u003eEvasion (3)\u003c\u002fb\u003e\u003cbr\u003eSegment 12: The revelation\u003cbr\u003e1 hit(s)\u003cbr\u003eCan you tell me—did she keep her hair long or short ×1","\u003cb\u003eAssumption (3)\u003c\u002fb\u003e\u003cbr\u003eSegment 2: First words: who saw whom\u003cbr\u003e1 hit(s)\u003cbr\u003eThey have too much to take in, I suppose ×1","\u003cb\u003eAssumption (3)\u003c\u002fb\u003e\u003cbr\u003eSegment 3: The resolve to hide, and the aunt at Saharanpur\u003cbr\u003e1 hit(s)\u003cbr\u003eAunts are usually formidable creatures ×1","\u003cb\u003eAssumption (3)\u003c\u002fb\u003e\u003cbr\u003eSegment 5: &quot;What is it like outside?&quot;\u003cbr\u003e2 hit(s)\u003cbr\u003eI wondered if my words had touched her or whether she thought me a romantic fool ×1, Had she noticed already that I could not see ×1","\u003cb\u003eAssumption (3)\u003c\u002fb\u003e\u003cbr\u003eSegment 8: Gallant and serious, and the journey&#x27;s end\u003cbr\u003e1 hit(s)\u003cbr\u003eOh, so you do have a pretty face, thought I ×1","\u003cb\u003eFace work (3)\u003c\u002fb\u003e\u003cbr\u003eSegment 3: The resolve to hide, and the aunt at Saharanpur\u003cbr\u003e1 hit(s)\u003cbr\u003eThen I had better not get too familiar ×1"],"x":[8,12,2,3,5,8,3],"y":["Evasion (3)","Evasion (3)","Assumption (3)","Assumption (3)","Assumption (3)","Assumption (3)","Face work (3)"],"type":"scatter"},{"hovertemplate":"%{text}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#b08d57","line":{"color":"white","width":1},"opacity":0.8,"size":[1,1,1,3,2,1,1,1,1,4,3,1,1,2],"sizemin":5,"sizemode":"area","sizeref":0.006172839506172839},"mode":"markers","name":"4. Conversational turn-taking","text":["\u003cb\u003eQuestions (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 2: First words: who saw whom\u003cbr\u003e1 hit(s)\u003cbr\u003eAre you going all the way to Dehra ×1","\u003cb\u003eQuestions (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 4: Mussoorie remembered, and the mistake\u003cbr\u003e1 hit(s)\u003cbr\u003eWhere are you going ×1","\u003cb\u003eQuestions (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 5: &quot;What is it like outside?&quot;\u003cbr\u003e1 hit(s)\u003cbr\u003e‘What is it like outside?’ ×1","\u003cb\u003eQuestions (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 6: At the window: the pretence of looking\u003cbr\u003e3 hit(s)\u003cbr\u003e‘Why don’t you look out of the window?’ ×1, ‘Have you noticed,’ I ventured, ‘that the trees seem to be moving while we seem to be standing still?’ ×1, ‘Do you see any animals?’ ×1","\u003cb\u003eTurn markers (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 2: First words: who saw whom\u003cbr\u003e2 hit(s)\u003cbr\u003eI asked ×1, I said ×1","\u003cb\u003eTurn markers (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 4: Mussoorie remembered, and the mistake\u003cbr\u003e1 hit(s)\u003cbr\u003eI said ×1","\u003cb\u003eTurn markers (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 5: &quot;What is it like outside?&quot;\u003cbr\u003e1 hit(s)\u003cbr\u003eI asked ×1","\u003cb\u003eTurn markers (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 6: At the window: the pretence of looking\u003cbr\u003e1 hit(s)\u003cbr\u003e‘That always happens,’ she said ×1","\u003cb\u003eTurn markers (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 7: Silence, then &quot;an interesting face&quot;\u003cbr\u003e1 hit(s)\u003cbr\u003e‘You have an interesting face,’ I remarked ×1","\u003cb\u003eTurn markers (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 8: Gallant and serious, and the journey&#x27;s end\u003cbr\u003e4 hit(s)\u003cbr\u003eI said ×1, ‘You are a very gallant young man,’ she said ×1, ‘But why are you so serious?’ ×1, ‘We’ll soon be at your station,’ I said ×1","\u003cb\u003eTurn markers (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 12: The revelation\u003cbr\u003e3 hit(s)\u003cbr\u003e‘You must be disappointed,’ he said ×1, ‘She was an interesting girl,’ I said ×1, ‘I don’t remember,’ he said sounding puzzled ×1","\u003cb\u003eSilence and closure (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 5: &quot;What is it like outside?&quot;\u003cbr\u003e1 hit(s)\u003cbr\u003eShe was silent ×1","\u003cb\u003eSilence and closure (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 7: Silence, then &quot;an interesting face&quot;\u003cbr\u003e1 hit(s)\u003cbr\u003eI turned from the window and faced the girl and for a while we sat in silence ×1","\u003cb\u003eSilence and closure (4)\u003c\u002fb\u003e\u003cbr\u003eSegment 11: A new passenger and the guessing game\u003cbr\u003e2 hit(s)\u003cbr\u003eThere was some confusion in the doorway ×1, Then the door banged and the world was shut out again ×1"],"x":[2,4,5,6,2,4,5,6,7,8,12,5,7,11],"y":["Questions (4)","Questions (4)","Questions (4)","Questions (4)","Turn markers (4)","Turn markers (4)","Turn markers (4)","Turn markers (4)","Turn markers (4)","Turn markers (4)","Turn markers (4)","Silence and closure (4)","Silence and closure (4)","Silence and closure (4)"],"type":"scatter"}],                        {"template":{"data":{"barpolar":[{"marker":{"line":{"color":"white","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"barpolar"}],"bar":[{"error_x":{"color":"rgb(36,36,36)"},"error_y":{"color":"rgb(36,36,36)"},"marker":{"line":{"color":"white","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"bar"}],"carpet":[{"aaxis":{"endlinecolor":"rgb(36,36,36)","gridcolor":"white","linecolor":"white","minorgridcolor":"white","startlinecolor":"rgb(36,36,36)"},"baxis":{"endlinecolor":"rgb(36,36,36)","gridcolor":"white","linecolor":"white","minorgridcolor":"white","startlinecolor":"rgb(36,36,36)"},"type":"carpet"}],"choropleth":[{"colorbar":{"outlinewidth":1,"tickcolor":"rgb(36,36,36)","ticks":"outside"},"type":"choropleth"}],"contourcarpet":[{"colorbar":{"outlinewidth":1,"tickcolor":"rgb(36,36,36)","ticks":"outside"},"type":"contourcarpet"}],"contour":[{"colorbar":{"outlinewidth":1,"tickcolor":"rg
